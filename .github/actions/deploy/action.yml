name: Deploy
description: Deploy a Docker Compose profile to the VPS and verify it comes back healthy

inputs:
  ssh-key:
    description: Private key for the VPS deploy user
    required: true
  ssh-host:
    description: VPS hostname or IP
    required: true
  ssh-user:
    description: VPS SSH user
    required: true
  project-path:
    description: Absolute path of the checked-out repo on the VPS (shared by both profiles)
    required: true
  branch:
    description: Branch to reset the checkout to before building
    required: true
  profile:
    description: Docker Compose profile to bring up (production or staging)
    required: true
  db-name:
    description: Postgres database this profile's backend connects to
    required: true
  health-url:
    description: Public URL to verify after deploying
    required: true
  commit-sha:
    description: SHA of the commit being deployed, verified against the live site after deploying
    required: true

runs:
  using: composite
  steps:
    - name: Configure SSH
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        SSH_HOST: ${{ inputs.ssh-host }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        # Fails fast with a clear error if the secret isn't a valid private key,
        # instead of a generic "Permission denied" from ssh much further down.
        ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

        ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

    - name: Deploy
      shell: bash
      env:
        SSH_USER: ${{ inputs.ssh-user }}
        SSH_HOST: ${{ inputs.ssh-host }}
        PROJECT_PATH: ${{ inputs.project-path }}
        BRANCH: ${{ inputs.branch }}
        PROFILE: ${{ inputs.profile }}
        DB_NAME: ${{ inputs.db-name }}
      run: |
        ssh "$SSH_USER@$SSH_HOST" bash -s -- "$PROJECT_PATH" "$BRANCH" "$PROFILE" "$DB_NAME" <<'REMOTE'
          set -euo pipefail

          PROJECT_PATH="$1"
          BRANCH="$2"
          PROFILE="$3"
          DB_NAME="$4"

          cd "$PROJECT_PATH"

          git fetch origin
          git reset --hard "origin/$BRANCH"

          set -a
          source .env
          set +a

          # Baked into the frontend image so the health check can confirm the live
          # site actually served this build, not a stale container left running.
          export VITE_BUILD_SHA="$(git rev-parse HEAD)"

          # Postgres is shared by both profiles and carries no "profiles:" key of its
          # own, so it must be brought up before the exists-check below can run.
          docker compose up -d postgres < /dev/null

          # < /dev/null on every "exec": without it, each one inherits this
          # whole script's own stdin (the SSH heredoc) and happily proxies it
          # into the container. The exec'd command ignores that input, but the
          # read still drains the pipe — silently eating every line of this
          # script that comes after it, so bash hits EOF and exits 0 having
          # never run the build below. This is what made every deploy "succeed"
          # on GitHub while quietly leaving the old container running.
          for _ in $(seq 1 10); do
            docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" < /dev/null && break
            sleep 2
          done
          docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" < /dev/null
          # The Postgres volume was initialized before this database existed, so
          # docker-entrypoint-initdb.d won't create it retroactively. Idempotent:
          # a no-op once the database is there (e.g. every production deploy).
          # $DB_NAME is a fixed value from the workflow (never user input), so
          # interpolating it directly is fine — psql's own "-v"/":'var'" client-side
          # substitution doesn't survive being passed through docker compose exec.
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -tAc \
            "SELECT 1 FROM pg_database WHERE datname = '$DB_NAME'" < /dev/null | grep -q 1 \
            || docker compose exec -T postgres psql -U "$POSTGRES_USER" -c "CREATE DATABASE \"$DB_NAME\"" < /dev/null

          # --force-recreate is scoped to the profile's own services (not postgres,
          # which has no "profiles:" key and would otherwise restart every deploy)
          # to guarantee the container is actually replaced even if Compose thinks
          # nothing changed.
          case "$PROFILE" in
            production) APP_SERVICES=(backend frontend) ;;
            staging) APP_SERVICES=(backend-staging frontend-staging) ;;
            *) echo "Unknown PROFILE: $PROFILE" >&2; exit 1 ;;
          esac
          docker compose --profile "$PROFILE" up -d --build --force-recreate --remove-orphans "${APP_SERVICES[@]}" < /dev/null
          docker image prune -af --filter "until=168h" < /dev/null
        REMOTE

    - name: Health check
      shell: bash
      env:
        HEALTH_URL: ${{ inputs.health-url }}
        EXPECTED_SHA: ${{ inputs.commit-sha }}
      run: bash ./.github/scripts/healthcheck.sh
