name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - id: start
        run: echo "time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/deploy
        with:
          ssh-key: ${{ secrets.VPS_SSH_KEY }}
          ssh-host: ${{ secrets.VPS_HOST }}
          ssh-user: ${{ secrets.VPS_USER }}
          project-path: /opt/apps/Portfolio
          branch: main
          profile: production
          db-name: portfolio
          health-url: https://thomasboue.com
          commit-sha: ${{ steps.sha.outputs.sha }}

      - uses: ./.github/actions/discord-notify
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          site-url: https://thomasboue.com
          started-at: ${{ steps.start.outputs.time }}
