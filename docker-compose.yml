services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-portfolio}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: [production]
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB:-portfolio}?schema=public
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-octocat}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CACHE_TTL_SECONDS: ${GITHUB_CACHE_TTL_SECONDS:-300}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-onboarding@resend.dev}
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-}
    ports:
      - '3000:3000'

  frontend:
    profiles: [production]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_BUILD_SHA: ${VITE_BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Same var as the build arg above, but read at container startup by the
      # docker-entrypoint.d script — changing it and running `up -d` (no
      # `--build`) is enough, no rebuild needed. See claude/architecture.md.
      API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - '8080:80'

  backend-staging:
    profiles: [staging]
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-portfolio}@postgres:5432/${POSTGRES_DB_STAGING:-portfolio_staging}?schema=public
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN_STAGING:-http://localhost:8081}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-octocat}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_CACHE_TTL_SECONDS: ${GITHUB_CACHE_TTL_SECONDS:-300}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-onboarding@resend.dev}
      CONTACT_NOTIFICATION_EMAIL: ${CONTACT_NOTIFICATION_EMAIL:-}
    ports:
      - '3001:3000'

  frontend-staging:
    profiles: [staging]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL_STAGING:-http://localhost:3001}
        VITE_BUILD_SHA: ${VITE_BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      - backend-staging
    environment:
      API_BASE_URL: ${VITE_API_BASE_URL_STAGING:-http://localhost:3001}
    ports:
      - '8081:80'

volumes:
  postgres_data:
