server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cached: the deploy healthcheck reads this to confirm the live
    # container actually matches the commit that was just deployed.
    location = /version.txt {
        add_header Cache-Control "no-store";
    }

    # Never cached: this is what makes the runtime API URL actually runtime —
    # without this, the immutable 30d rule above (which matches *.js) would
    # let browsers keep serving a stale API_BASE_URL for up to a month.
    # An exact match (=) always outranks the regex location regardless of
    # declaration order, so this applies even though it's listed after it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
